# Planning reference for later experiments; the initial CLI has its own defaults.
# Record any changed settings in the report.
model: random_forest
random_state: 42
test_size: 0.20
random_forest:
  n_estimators: 200
  min_samples_leaf: 2
  n_jobs: -1
rul_unit: remaining_recordings
metrics:
  - mae
  - rmse
