[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-rul"
version = "0.1.0"
description = "Educational predictive maintenance project for rolling bearing RUL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
lstm = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
