
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-rul"
version = "0.1.0"
description = "Educational predictive maintenance project for rolling bearing RUL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "joblib>=1.3,<2",
    "PyWavelets>=1.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
training = [
    "torch>=2.2",
]

dashboard = [
    "matplotlib>=3.7",
    "plotly>=5.18",
    "streamlit>=1.35",
]

dev = [
    "pytest>=8,<10",
    "torch>=2.2",
]

all = [
    "torch>=2.2",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "streamlit>=1.35",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
